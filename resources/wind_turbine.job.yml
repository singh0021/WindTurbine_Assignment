# Orchestration job: lands new data, then runs the medallion pipeline as plain
# notebook tasks (no Declarative Pipelines / DLT required).
#
#   land_data ──▶ bronze ──▶ silver ──▶ gold
#
# All tasks share a single job cluster (cheaper than spinning one up per task).
resources:
  jobs:
    wind_turbine_daily_job:
      name: "[${bundle.target}] wind_turbine_daily_job"

      schedule:
        # assumption 02:00 UTC every day — after the daily 24h extract has landed.
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}

      job_clusters:
        - job_cluster_key: medallion_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1

      tasks:
        - task_key: land_data
          job_cluster_key: medallion_cluster
          notebook_task:
            notebook_path: ../src/setup/land_sample_data.py
            base_parameters:
              landing_path: ${var.landing_path}


        - task_key: bronze
          depends_on:
            - task_key: land_data
          job_cluster_key: medallion_cluster
          notebook_task:
            notebook_path: ../src/jobs/bronze_ingest.py
            base_parameters:
              schema: ${var.schema}
              landing_path: ${var.landing_path}
              checkpoint_path: ${var.storage_path}
              src_path: ${workspace.file_path}/src

        - task_key: silver
          depends_on:
            - task_key: bronze
          job_cluster_key: medallion_cluster
          notebook_task:
            notebook_path: ../src/jobs/silver_transform.py
            base_parameters:
              schema: ${var.schema}
              dq_rules_path: ${workspace.file_path}/resources/dq_rules.csv
              src_path: ${workspace.file_path}/src

        - task_key: gold
          depends_on:
            - task_key: silver
          job_cluster_key: medallion_cluster
          notebook_task:
            notebook_path: ../src/jobs/gold_aggregate.py
            base_parameters:
              schema: ${var.schema}
              src_path: ${workspace.file_path}/src
