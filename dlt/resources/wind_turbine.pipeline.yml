# Lakeflow Declarative Pipeline (bronze -> silver -> gold).
#
# NOT included in the default bundle — this requires the Declarative Pipelines
# (DLT) feature to be enabled in the workspace. See dlt/README.md for how to
# switch the bundle from the plain-job pipeline to this one.
#
# Each layer is defined as one or more tables in dlt/pipelines/*.py. The pipeline
# resolves the dependency DAG automatically and runs each dataset as an
# independent, individually-observable flow — so a single stage can be retried or
# inspected without re-running the others.
resources:
  pipelines:
    wind_turbine_pipeline:
      name: "[${bundle.target}] wind_turbine_pipeline"
      # hive_metastore mode: publish to a schema with an explicit storage root
      # (no `catalog` / `serverless`, which require Unity Catalog).
      target: ${var.schema}
      storage: ${var.storage_path}
      edition: ADVANCED
      channel: CURRENT
      photon: true
      development: true
      libraries:
        - file:
            path: ../pipelines/00_bronze.py
        - file:
            path: ../pipelines/01_silver.py
        - file:
            path: ../pipelines/02_gold.py
      configuration:
        source_path: ${var.landing_path}
        dq_rules_path: ${workspace.file_path}/resources/dq_rules.csv
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
